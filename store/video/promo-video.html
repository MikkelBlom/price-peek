<!doctype html>
<meta charset="utf-8">
<title>Price Peek Promo Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* A 30 s promo built as one continuous world filmed by a virtual camera: no slide cuts, every
   transition is a camera move (pull-back, whip-pan, reel scroll, dolly-through, zoom into a badge).
   Drawn on a 1280×720 stage scaled to 1920×1080. render(t) derives every frame from the time alone,
   so record.js can step it (with sub-frames for real motion blur). Open the page to watch it live:
   space pauses, click scrubs. Timing sits on a 120 BPM grid (one beat = 0.5 s) for a music bed. */
* { box-sizing: border-box; }
html, body { margin: 0; background: #0b0c0f; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; overflow: hidden; transform-origin: 0 0;
  background: #eef1f6; color: #14161b; font-family: "Instrument Sans", "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
#grid { position: absolute; inset: -2px; background-image: radial-gradient(circle, #d3d8e1 1.3px, transparent 1.6px); }
#glow { position: absolute; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,255,255,.85), rgba(255,255,255,0)); }
.layer { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
#world { transform-origin: 0 0; }
.abs { position: absolute; }

.h { position: absolute; margin: 0; font: 800 76px/0.98 "Bricolage Grotesque", sans-serif; letter-spacing: -.035em; }
.accent { color: #3355ff; }
/* masked type: each word or character rises out of its own clip box */
.wm { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .02em .14em; margin: 0 -.02em -.14em; }
.wi { display: inline-block; }
.mark { position: absolute; left: 80px; bottom: 56px; display: flex; align-items: center; gap: 12px; font: 700 24px "Bricolage Grotesque", sans-serif; letter-spacing: -.01em; }
.mark i { display: inline-block; background: #14161b; color: #fff; font: 700 15px/1.75 "Segoe UI", sans-serif; font-style: normal; padding: 0 .55em; border-radius: 7px 7px 7px 1px; }

/* the badge, as the extension draws it; it grows out of its sharp corner */
.b { position: absolute; white-space: nowrap; background: #14161b; color: #fff; font: 600 19px/1.75 "Segoe UI", "Instrument Sans", sans-serif; padding: 0 .6em;
  border-radius: 8px 8px 8px 2px; box-shadow: 0 6px 16px -6px rgba(10,12,16,.45); transform-origin: 0 100%; letter-spacing: 0; }
.rl { display: inline-block; overflow: hidden; height: 1.75em; vertical-align: top; }
.rl > span { display: block; }
.rl > span > span { display: block; height: 1.75em; }

.chip { position: absolute; background: #fff; border-radius: 22px; padding: 22px 30px 20px; box-shadow: 0 24px 48px -28px rgba(20,24,40,.35), 0 0 0 1px rgba(20,24,40,.05); }
.chip .city { display: block; margin-top: 8px; font: 600 15px "Instrument Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #8a90a0; }
.chip .p { white-space: nowrap; position: relative; display: inline-block; margin-top: 10px; font: 700 44px/1.1 "Instrument Sans", sans-serif; letter-spacing: -.02em; }
.chip .p .b { top: -30px; right: -34px; }

.item { position: absolute; transform-origin: 0 50%; }
.item .w { position: relative; display: inline-block; font: 700 92px/1.05 "Instrument Sans", sans-serif; letter-spacing: -.03em; white-space: nowrap; }
.item .w .b { top: -34px; right: -46px; font-size: 28px; }
.item .note { display: block; margin-top: 14px; font: 600 16px "Instrument Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #8a90a0; }

.pop { position: absolute; width: 400px; background: #fff; border-radius: 20px; box-shadow: 0 50px 90px -40px rgba(20,24,40,.5), 0 0 0 1px rgba(20,24,40,.06); font-family: "Instrument Sans", sans-serif; transform-origin: 0 50%; }
.pop header { display: flex; align-items: center; gap: 14px; padding: 20px 22px; border-bottom: 1px solid #eceef2; }
.pop header i { font: 700 15px/1.75 "Segoe UI", sans-serif; font-style: normal; background: #14161b; color: #fff; padding: 0 .55em; border-radius: 7px 7px 7px 1px; }
.pop header b { display: block; font-size: 18px; line-height: 1.75; height: 1.75em; overflow: hidden; } .pop header small { display: block; color: #8a90a0; font-size: 14px; }
.pop .r { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 15px 22px; border-bottom: 1px solid #eceef2; font-size: 17px; }
.pop .r:last-child { border-bottom: 0; }
.pop .sel { border: 1px solid #dfe2e8; border-radius: 9px; padding: 2px 12px; font-size: 16px; font-weight: 600; background: #fff; line-height: 1.75; }
.pop .sel.open { border-color: #3355ff; box-shadow: 0 0 0 4px rgba(51,85,255,.15); }
.menu { position: absolute; right: 22px; top: 54px; width: 236px; background: #fff; border-radius: 12px; padding: 6px; z-index: 2; transform-origin: 70% 0;
  box-shadow: 0 24px 48px -20px rgba(20,24,40,.4), 0 0 0 1px rgba(20,24,40,.08); }
.menu .opt { position: relative; padding: 8px 10px; border-radius: 8px; font-size: 15px; font-weight: 500; z-index: 1; }
.menu .opt b { display: inline-block; width: 42px; font-weight: 700; }
.menu .opt.hi { color: #fff; }
.menu .pill { position: absolute; left: 6px; right: 6px; height: 36px; border-radius: 8px; background: #3355ff; }
.tg { width: 44px; height: 26px; border-radius: 13px; background: #14161b; position: relative; }
.tg::after { content: ""; position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
.tg.off { background: #d5d8de; } .tg.off::after { right: auto; left: 4px; }
.yen { position: absolute; transform-origin: 0 50%; white-space: nowrap; }
.yen .w { position: relative; display: inline-block; font: 700 92px/1.05 "Instrument Sans", sans-serif; letter-spacing: -.03em; }
.yen .w .b { top: -34px; right: -46px; font-size: 28px; transform-origin: 50% 100%; }
#cursor { position: absolute; left: 0; top: 0; width: 26px; z-index: 5; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); transform-origin: 2px 2px; }
#ripple { position: absolute; left: 0; top: 0; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 2px solid #3355ff; z-index: 4; }

.form { position: absolute; background: #fff; border-radius: 22px; padding: 34px 38px 40px; box-shadow: 0 50px 90px -40px rgba(20,24,40,.5), 0 0 0 1px rgba(20,24,40,.06); transform-origin: 0 50%; }
.form .lab { font: 600 16px "Instrument Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #8a90a0; }
.form .line { display: flex; align-items: center; gap: 18px; margin-top: 16px; font: 600 28px "Instrument Sans", sans-serif; color: #5b6170; }
.inp { position: relative; width: 330px; height: 78px; border-radius: 14px; border: 2px solid #dfe2e8; font: 600 36px/74px "Instrument Sans", sans-serif; color: #14161b; padding: 0 20px; white-space: nowrap; }
.inp.focus { border-color: #3355ff; box-shadow: 0 0 0 5px rgba(51,85,255,.15); }
.inp .pre { color: #9aa0ad; margin-right: 6px; }
.inp .ch { display: inline-block; }
.inp .caret { display: inline-block; width: 2px; height: 38px; background: #3355ff; vertical-align: -6px; margin-left: 2px; }
.inp .b { top: -34px; right: -24px; font-size: 24px; }

#end { background: #14161b; color: #f3f4f7; }
.logo { position: absolute; left: 640px; top: 150px; font: 700 64px/1.75 "Segoe UI", sans-serif; padding: 0 .42em; border-radius: 30px 30px 30px 5px; background: #fff; color: #14161b; }
.name { position: absolute; left: 0; right: 0; top: 330px; text-align: center; margin: 0; font: 800 116px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.04em; transform-origin: 640px 0; }
.tag { position: absolute; left: 0; right: 0; top: 476px; text-align: center; margin: 0; font: 500 34px "Instrument Sans", sans-serif; color: #a5abb8; transform-origin: 640px 0; }
.tag .accent { color: #8ea0ff; }
#end .b { background: #262a33; color: #c9cdd6; box-shadow: none; transform-origin: 50% 50%; }
</style>

<div id="stage">
  <div id="grid"></div>
  <div id="glow"></div>

  <!-- the world the camera moves through -->
  <div class="layer" id="world">
    <!-- A/B · prices from everywhere, centred on (640, 360) -->
    <h2 class="h" id="hA" style="left:80px;top:190px;width:470px"></h2>
    <h2 class="h" id="hB" style="left:80px;top:150px;width:520px"></h2>
    <div id="chips"></div>
    <!-- C · the reel of local formats, from (2190, 330) downwards; D's yen is its last item -->
    <div id="reel"></div>
    <div class="yen" id="yen"><span class="w" id="yenW"><span class="b" id="yenB"></span></span></div>
    <div id="popWrap" class="abs" style="left:2380px;top:800px">
      <div class="pop" id="pop">
        <header><i>kr.</i><div><b id="rateLine"></b><small>Daily ECB rate</small></div></header>
        <div class="r">Convert to <span class="sel" id="sel"></span>
          <div class="menu" id="menu"><div class="pill" id="pill"></div></div></div>
        <div class="r">On <span class="tg"></span></div>
        <div class="r">On this site <span class="tg"></span></div>
        <div class="r">Show all prices <span class="tg off"></span></div>
        <div class="r">Area &amp; weight <span class="tg"></span></div>
      </div>
    </div>
  </div>

  <!-- screen-space headlines that stay put while the camera moves -->
  <div class="layer" id="hud">
    <h2 class="h" id="hC" style="left:80px;top:200px;width:430px"></h2>
    <h2 class="h" id="hD" style="left:80px;top:96px;width:620px"></h2>
  </div>
  <svg id="cursor" viewBox="0 0 26 36"><path d="M2 2v28l7.5-7 5 11 5-2.3-5-10.7H25z" fill="#14161b" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>
  <div id="ripple"></div>

  <!-- E · typed numbers, reached by dollying through D -->
  <div class="layer" id="lE">
    <h2 class="h" id="hE" style="left:80px;top:170px;width:500px"></h2>
    <div class="form" id="form" style="left:640px;top:150px;width:580px">
      <div class="lab">Price range · min</div>
      <div class="line"><div class="inp" id="in1"></div>원</div>
      <div class="lab" style="margin-top:46px">Budget</div>
      <div class="line"><div class="inp" id="in2"></div></div>
    </div>
  </div>

  <div class="mark" id="mark"><i>kr.</i>Price Peek</div>

  <!-- F · end card, entered through the inside of a badge -->
  <div class="layer" id="end">
    <div id="floats"></div>
    <div class="logo" id="logo">kr.</div>
    <h2 class="name" id="name"></h2>
    <p class="tag" id="tag"></p>
  </div>
</div>

<script>
// Same EUR-based rates and Danish formatting as store/promo.html and the extension.
const R = { EUR: 1, DKK: 7.4748, KRW: 1499.01, USD: 1.1253, GBP: 0.84385, JPY: 177.82, CNY: 7.524, CHF: 0.9272, THB: 37.602 };
const dk = (n, d = 0) => n.toLocaleString("da-DK", { minimumFractionDigits: d, maximumFractionDigits: d });
const FMT = { DKK: { suf: " kr." }, EUR: { pre: "€" }, USD: { pre: "$" }, GBP: { pre: "£" } };
function money(v, c = "DKK") {
  const f = FMT[c]; let num, sc = "";
  if (v >= 1e9) { num = dk(v / 1e9, 1); sc = " mia."; } else if (v >= 1e8) { num = dk(v / 1e6, 0); sc = " mio."; }
  else if (v >= 1e6) { num = dk(v / 1e6, 1); sc = " mio."; } else if (v >= 10) num = dk(Math.round(v)); else num = dk(v, 2);
  return f.pre ? `${f.pre}${num}${sc}` : `${num}${sc}${f.suf}`;
}
const conv = (v, from, to = "DKK") => money(v / R[from] * R[to], to);

const DURATION = 30;
const $ = id => document.getElementById(id);

// ---------- motion toolkit ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, t0, d) => clamp((t - t0) / d);
const lerp = (a, b, p) => a + (b - a) * p;
const expoOut = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const quartInOut = p => p < .5 ? 8 * p ** 4 : 1 - Math.pow(-2 * p + 2, 4) / 2;
const cubicInOut = p => p < .5 ? 4 * p ** 3 : 1 - Math.pow(-2 * p + 2, 3) / 2;
const sineInOut = p => -(Math.cos(Math.PI * p) - 1) / 2;
// damped spring, 0 → 1 with overshoot; freq in Hz, zeta < 1 bounces
function spring(t, freq = 1.8, zeta = .5) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * freq, wd = w * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + (zeta * w / wd) * Math.sin(wd * t));
}
const tf = (el, css, o = 1) => { el.style.transform = css; el.style.opacity = o; el.style.visibility = o <= .001 ? "hidden" : "visible"; };

// masked type: "Every price, in |your| currency." → words (or characters) in clip boxes
function masked(el, text, { chars = false } = {}) {
  const parts = text.split(/(\|[^|]*\|)/).filter(Boolean);
  let html = "";
  for (const part of parts) {
    const accent = part.startsWith("|"), s = accent ? part.slice(1, -1) : part;
    const units = chars ? [...s] : s.split(/(\s+)/);
    for (const u of units) {
      if (u === "") continue;
      if (!chars && /^\s+$/.test(u)) { html += " "; continue; }
      html += `<span class="wm"><span class="wi${accent ? " accent" : ""}">${u === " " ? "&nbsp;" : u}</span></span>`;
    }
  }
  el.insertAdjacentHTML("afterbegin", html);
  return [...el.querySelectorAll(".wi")];
}
// rise in from below, leave upwards; per-unit stagger
function typeIn(units, t, tin, tout = Infinity, { stagger = .05, dur = .75 } = {}) {
  units.forEach((u, i) => {
    const pin = expoOut(prog(t, tin + i * stagger, dur));
    const pout = quartInOut(prog(t, tout + i * stagger * .6, .5));
    u.style.transform = `translateY(${(1 - pin) * 140 - pout * 140}%) rotate(${(1 - pin) * 6}deg)`;
  });
}
// odometer: characters that differ roll up from the old string to the new one, right to left
function roll(a, b, p) {
  const n = Math.max(a.length, b.length), A = a.padStart(n, " "), B = b.padStart(n, " ");
  let html = "";
  for (let i = 0; i < n; i++) {
    const ca = A[i] === " " ? "" : A[i], cb = B[i] === " " ? "" : B[i];
    if (ca === cb) { html += cb === " " ? "&nbsp;" : cb; continue; }
    const q = expoOut(clamp(p * 1.4 - (n - 1 - i) * .05));
    if (q >= 1) { html += cb === " " ? "&nbsp;" : cb; continue; }
    html += `<span class="rl"><span style="transform:translateY(${-q * 50}%)"><span>${ca === " " || !ca ? "&nbsp;" : ca}</span><span>${cb === " " || !cb ? "&nbsp;" : cb}</span></span></span>`;
  }
  return html;
}
// whole-string swap: the old text slides up and out as the new one rises in
function slide(a, b, p) {
  const q = expoOut(p);
  return q >= 1 ? b : `<span class="rl"><span style="transform:translateY(${-q * 50}%)"><span>${a}</span><span>${b}</span></span></span>`;
}
// a badge that grows out of its sharp corner with a springy overshoot
function badgeIn(el, t, t0, freq = 2.1) {
  const s = spring(t - t0, freq, .42);
  tf(el, `scale(${t < t0 ? 0 : Math.max(0, s)}) rotate(${(1 - clamp(s)) * -8}deg)`, clamp((t - t0) * 9));
}
// keyframed scalar: [[t, v, ease?], ...]; the ease belongs to the segment ending at that key
function keys(t, ks, ease = cubicInOut) {
  if (t <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) if (t < ks[i][0]) {
    const [ta, va] = ks[i - 1], [tb, vb, e] = ks[i];
    return lerp(va, vb, (e || ease)(prog(t, ta, tb - ta)));
  }
  return ks[ks.length - 1][1];
}

// ---------- content ----------
const A_HEAD = masked($("hA"), "Shopping |abroad?|");
const B_HEAD = masked($("hB"), "Every price, in |your| currency.");
const C_HEAD = masked($("hC"), "Reads prices the |local| way.");
const D_HEAD = masked($("hD"), "Your currency, your call.");
const E_HEAD = masked($("hE"), "Even the numbers you |type.|");

const CHIPS = [
  ["Seoul", "₩1,500,000", 1500000, "KRW", 600, 62],
  ["New York", "$249", 249, "USD", 1040, 116],
  ["Berlin", "19,99 €", 19.99, "EUR", 640, 258],
  ["Tokyo", "¥42,800", 42800, "JPY", 960, 314],
  ["London", "£219", 219, "GBP", 660, 452],
  ["Bangkok", "฿8,490", 8490, "THB", 1000, 500],
];
$("chips").innerHTML = CHIPS.map(([city, txt, v, c, x, y], i) =>
  `<div class="chip" id="c${i}" style="left:${x}px;top:${y}px"><span class="p" id="cp${i}"><span class="b" id="cb${i}">${conv(v, c)}</span></span><span class="city">${city}</span></div>`).join("");
const CHIP_CHARS = CHIPS.map((ch, i) => masked($("cp" + i), ch[1], { chars: true }));
// where each chip flies in from (relative), and the beat its badge lands on
const CHIP_IN = [[0, 0], [380, -160], [-260, 60], [320, 120], [-200, 260], [300, 300]];
const T_CHIP = [0, 1.1, 1.25, 1.4, 1.55, 1.7];
const T_BADGE = [3.5, 3.75, 4.0, 4.25, 4.5, 4.75];

const REEL = [
  ["3억 5,000만원", 350000000, "KRW", "Korean 억 and 만"],
  ["3万円", 30000, "JPY", "Japanese 万"],
  ["19,99 €", 19.99, "EUR", "Decimal comma"],
];
const REEL_X = 2190, REEL_Y0 = 330, REEL_GAP = 250;
$("reel").innerHTML = REEL.map(([w, v, c, note], i) =>
  `<div class="item" id="it${i}" style="left:${REEL_X}px;top:${REEL_Y0 + i * REEL_GAP - 70}px"><span class="w" id="iw${i}"><span class="b" id="ib${i}">${conv(v, c)}</span></span><span class="note">${note}</span></div>`).join("");
const REEL_CHARS = REEL.map((r, i) => masked($("iw" + i), r[0], { chars: true }));
const YEN_CHARS = masked($("yenW"), "¥42,800", { chars: true });
// camera arrives on each reel item at these times; the yen is item 3
const T_REEL = [7.25, 9.25, 11.25, 13.25];

const OPTS = [["DKK", "Danish krone"], ["EUR", "Euro"], ["USD", "US dollar"], ["GBP", "British pound"], ["SEK", "Swedish krona"], ["NOK", "Norwegian krone"]];
$("menu").insertAdjacentHTML("beforeend", OPTS.map(([c, n]) => `<div class="opt"><b>${c}</b>${n}</div>`).join(""));
const T_D = { popIn: 13.55, cursorIn: 14.3, atSel: 15.0, open: 15.1, glide: 15.65, pick: 16.3, cursorOut: 17.4 };

const TYPE1 = { t0: 20.45, gap: .2, text: "500000", cur: "KRW", focus: 20.1 };
const TYPE2 = { t0: 22.3, gap: .22, text: "1200", cur: "USD", focus: 21.95 };
const T_E = { dolly: 19.0, zoom: 24.15, zoomEnd: 25.35 };

const NAME_CHARS = masked($("name"), "Price Peek", { chars: true });
const TAG_WORDS = masked($("tag"), "Any price, in |your| currency.");
// end-card floats in three depth planes: [text, x, y, depth 0 far … 2 near]
const FLOATS = [["7.480 kr.", 150, 120, 1], ["€241", 1050, 96, 0], ["1.654 kr.", 1040, 590, 2], ["$271", 190, 580, 0],
  ["1,7 mio. kr.", 960, 250, 0], ["149 kr.", 120, 340, 2], ["£203", 1130, 420, 1], ["1.261 kr.", 330, 640, 1]];
$("floats").innerHTML = FLOATS.map(([s, x, y], i) => `<span class="b" id="f${i}" style="left:${x}px;top:${y}px">${s}</span>`).join("");
const T_F = { logo: 25.5, name: 25.8, tag: 26.35 };

// ---------- camera ----------
// world point (cx, cy) sits at the screen centre, zoomed by s
function camera(t) {
  const cx = keys(t, [[0, 795], [.95, 795], [2.45, 640, quartInOut], [6.7, 650, sineInOut], [7.3, 2240, quartInOut]]);
  const cy = keys(t, [[0, 112], [.95, 116], [2.45, 360, quartInOut], [6.7, 352, sineInOut], [7.3, 360, quartInOut],
    [9.0, 360], [9.55, 360 + REEL_GAP, quartInOut], [11.0, 360 + REEL_GAP], [11.55, 360 + 2 * REEL_GAP, quartInOut],
    [13.0, 360 + 2 * REEL_GAP], [13.6, 360 + 3 * REEL_GAP, quartInOut], [19, 370 + 3 * REEL_GAP, sineInOut]]);
  // pull back from the extreme close-up, then a slow push-in on every hold so the frame never sits still
  const s = keys(t, [[0, 2.7], [.95, 2.55], [2.45, 1, quartInOut], [6.7, 1.07, sineInOut], [7.0, 1.0, quartInOut],
    [13.1, 1.05, sineInOut], [13.6, 1, quartInOut], [19, 1.06, sineInOut]]);
  return { cx, cy, s };
}

function stagePoint(el, fx, fy) {
  const st = $("stage").getBoundingClientRect(), k = st.width / 1280, r = el.getBoundingClientRect();
  return [(r.left - st.left + r.width * fx) / k, (r.top - st.top + r.height * fy) / k];
}

function render(t) {
  const cam = camera(t);
  const world = $("world");
  // D → E: dolly through the popup; the world grows and fades while E arrives from behind
  const dol = cubicInOut(prog(t, T_E.dolly, .75));
  const ws = cam.s * (1 + dol * 1.4);
  world.style.transform = `translate(640px,360px) scale(${ws}) translate(${-cam.cx}px,${-cam.cy}px)`;
  world.style.opacity = 1 - dol;
  world.style.visibility = dol >= 1 ? "hidden" : "visible";
  // background dot grid moves at half speed for depth
  const gz = ws * .5 + .5, g = $("grid");
  g.style.backgroundSize = `${28 * gz}px ${28 * gz}px`;
  g.style.backgroundPosition = `${-cam.cx * .5 * gz + 640}px ${-cam.cy * .5 * gz + 360}px`;
  const gl = $("glow"); gl.style.left = 640 + Math.sin(t * .35) * 260 + "px"; gl.style.top = 330 + Math.cos(t * .27) * 140 + "px";

  // A · Seoul chars roll in at the close-up, the other chips fly in as the camera pulls back
  CHIPS.forEach((_, i) => {
    const el = $("c" + i), [dx, dy] = CHIP_IN[i];
    const s = i === 0 ? 1 : spring(t - T_CHIP[i], 1.25, .62);
    const land = t > T_BADGE[i] ? Math.sin(Math.min(1, (t - T_BADGE[i]) / .35) * Math.PI) * .035 * Math.exp(-(t - T_BADGE[i]) * 3) : 0;
    const bob = Math.sin(t * 1.1 + i * 1.9) * 4 * clamp(t - 2.5);
    tf(el, `translate(${dx * (1 - s)}px,${dy * (1 - s) + bob}px) rotate(${(1 - s) * (i % 2 ? 9 : -9)}deg) scale(${(i === 0 ? 1 : lerp(.7, 1, s)) * (1 + land)})`,
      i === 0 ? clamp(t * 6) : clamp((t - T_CHIP[i]) * 5));
    typeIn(CHIP_CHARS[i], t, i === 0 ? .15 : T_CHIP[i] + .1, Infinity, i === 0 ? { stagger: .045, dur: .8 } : { stagger: .03, dur: .6 });
    badgeIn($("cb" + i), t, T_BADGE[i]);
  });
  typeIn(A_HEAD, t, 2.05, 3.15, { stagger: .08 });
  typeIn(B_HEAD, t, 3.3, Infinity, { stagger: .06 });

  // C · the reel: the camera scrolls down item by item; items away from the centre shrink and dim
  REEL.forEach((_, i) => {
    const el = $("it" + i), d = (REEL_Y0 + i * REEL_GAP - (cam.cy - 30)) / REEL_GAP;
    const k = Math.min(Math.abs(d), 1.6);
    tf(el, `scale(${1 - .14 * k})`, t < T_REEL[i] - .3 ? 0 : clamp(1 - .7 * k) * (1 - prog(t, 13.2, .5)));
    typeIn(REEL_CHARS[i], t, T_REEL[i] - .25, Infinity, { stagger: .035, dur: .7 });
    badgeIn($("ib" + i), t, T_REEL[i] + .5);
  });
  typeIn(C_HEAD, t, 7.45, 12.75, { stagger: .07 });

  // D · the yen is the reel's next item; it slides left as the popup swings in
  {
    const y = $("yen"), arrive = T_REEL[3];
    const slide = expoOut(prog(t, 13.55, 1.0));
    const d = (REEL_Y0 + 3 * REEL_GAP - (cam.cy - 30)) / REEL_GAP, k = Math.min(Math.abs(d), 1.6);
    y.style.left = lerp(REEL_X, 1690, slide) + "px";
    y.style.top = lerp(REEL_Y0 + 3 * REEL_GAP - 70, 1150 - 60, slide) + "px";
    tf(y, `scale(${(1 - .14 * k) * lerp(1, .9, slide)})`, t < arrive - .3 ? 0 : 1 - .6 * Math.min(k, 1.2));
    typeIn(YEN_CHARS, t, arrive - .25, Infinity, { stagger: .035, dur: .7 });
  }
  typeIn(D_HEAD, t, 13.8, Infinity, { stagger: .06 });
  {
    const p = spring(t - T_D.popIn, 1.0, .7), drift = sineInOut(prog(t, 14.5, 4.5));
    tf($("popWrap"), `perspective(1500px) translateX(${(1 - p) * 520}px) rotateY(${lerp(-38, -10, p) + drift * 5}deg) rotateX(${2 - drift * 2}deg)`, clamp((t - T_D.popIn) * 4));
  }
  const pk = prog(t, T_D.pick, .55);
  $("sel").innerHTML = t < T_D.pick ? "DKK · Danish krone ▾" : slide("DKK · Danish krone ▾", "EUR · Euro ▾", pk);
  $("rateLine").innerHTML = t < T_D.pick ? `1.000 ₩ = ${conv(1000, "KRW")}` : slide(`1.000 ₩ = ${conv(1000, "KRW")}`, `1.000 ₩ = ${conv(1000, "KRW", "EUR")}`, pk);
  {
    // the yen badge lands as DKK, then flips over to EUR when the user picks it
    const yb = $("yenB"), t0 = T_REEL[3] + .5;
    if (t < T_D.pick + .05) { yb.textContent = conv(42800, "JPY"); badgeIn(yb, t, t0); }
    else {
      const f = (t - T_D.pick - .05) / .5;
      const half = f < .5;
      yb.textContent = half ? conv(42800, "JPY") : conv(42800, "JPY", "EUR");
      const ang = half ? f * 2 * 90 : lerp(-90, 0, spring((f - .5) * .5, 2.2, .45));
      tf(yb, `perspective(500px) rotateX(${ang}deg)`, 1);
    }
  }
  {
    const open = t >= T_D.open && t < T_D.pick + .15;
    $("sel").classList.toggle("open", open);
    const m = $("menu");
    if (t >= T_D.open && t < T_D.pick + .3) {
      const pin = spring(t - T_D.open, 2.4, .7), pout = cubicInOut(prog(t, T_D.pick + .08, .2));
      tf(m, `translateY(${(1 - pin) * -10}px) scale(${lerp(.92, 1, pin) - pout * .04})`, clamp((t - T_D.open) * 8) * (1 - pout));
      const opts = [...m.querySelectorAll(".opt")];
      opts.forEach((o, i) => { const q = expoOut(prog(t, T_D.open + .04 + i * .035, .4)); o.style.transform = `translateY(${(1 - q) * -8}px)`; o.style.opacity = q; });
      const gp = spring(t - T_D.glide, 2.6, .75);
      const top = lerp(opts[0].offsetTop, opts[1].offsetTop, gp);
      $("pill").style.top = top + "px";
      opts.forEach(o => o.classList.toggle("hi", Math.abs(o.offsetTop - top) < 18));
    } else tf(m, "none", 0);
  }
  // cursor: curved paths between live-measured targets, a press squash and a ripple on each click
  {
    const c = $("cursor"), rp = $("ripple");
    if (t > T_D.cursorIn - .1 && t < 18.6) {
      const selP = stagePoint($("sel"), .55, .6);
      const opt1 = $("menu").querySelectorAll(".opt")[1];
      const eurP = $("menu").style.visibility === "visible" ? stagePoint(opt1, .35, .55) : (window.lastEur || [selP[0] - 40, selP[1] + 60]);
      window.lastEur = eurP;
      const path = [[T_D.cursorIn, [1250, 690]], [T_D.atSel, selP], [T_D.glide - .1, selP], [T_D.glide + .3, eurP], [T_D.cursorOut, eurP], [18.4, [eurP[0] + 150, eurP[1] + 210]]];
      let p = path[0][1];
      for (let i = 1; i < path.length; i++) {
        const [ta, a] = path[i - 1], [tb, b] = path[i];
        if (t >= ta) {
          const e = cubicInOut(prog(t, ta, tb - ta));
          const mx = (a[0] + b[0]) / 2 - (b[1] - a[1]) * .25, my = (a[1] + b[1]) / 2 + (b[0] - a[0]) * .25;
          p = [(1 - e) ** 2 * a[0] + 2 * (1 - e) * e * mx + e * e * b[0], (1 - e) ** 2 * a[1] + 2 * (1 - e) * e * my + e * e * b[1]];
        }
      }
      const press = [T_D.open, T_D.pick].reduce((m, tc) => Math.max(m, 1 - Math.abs(t - tc) / .09), 0);
      tf(c, `translate(${p[0]}px,${p[1]}px) scale(${1 - .14 * clamp(press)})`, clamp((t - T_D.cursorIn) * 4) * (1 - prog(t, 18.1, .4)));
      const rc = [T_D.open, T_D.pick].find(tc => t >= tc && t < tc + .5);
      if (rc !== undefined) { const q = expoOut(prog(t, rc, .5)); tf(rp, `translate(${p[0]}px,${p[1]}px) scale(${.3 + q * 1.3})`, (1 - q) * .8); }
      else tf(rp, "none", 0);
    } else { tf(c, "none", 0); tf(rp, "none", 0); }
  }

  // HUD headlines leave with the world during the dolly
  tf($("hud"), `scale(${1 + dol * .5})`, 1 - dol);
  $("hud").style.transformOrigin = "640px 360px";

  // E · typing; the inputs are filled before E's transform so the zoom can measure the final badge
  typeIn(E_HEAD, t, 19.55, Infinity, { stagger: .06 });
  for (const [el, k] of [[$("in1"), TYPE1], [$("in2"), TYPE2]]) {
    const focus = k === TYPE1 ? t >= k.focus && t < TYPE2.focus : t >= k.focus;
    const n = clamp(Math.floor((t - k.t0) / k.gap) + 1, 0, k.text.length);
    const s = k.text.slice(0, n), last = k.t0 + (n - 1) * k.gap;
    el.classList.toggle("focus", focus);
    const shown = k.cur === "USD" ? s.replace(/\B(?=(\d{3})+(?!\d))/g, ",") : s;
    const chars = [...shown].map((ch, i) => {
      // the newest key lands with a little drop
      const isNew = i === shown.length - 1 && t - last < .25, q = isNew ? expoOut(prog(t, last, .22)) : 1;
      return `<span class="ch" style="transform:translateY(${(1 - q) * -14}px) scale(${lerp(1.25, 1, q)});opacity:${q}">${ch}</span>`;
    }).join("");
    const caret = focus && ((t * 1.9) % 1 < .55 || t - last < .5) ? `<span class="caret"></span>` : "";
    let badge = "";
    if (n) {
      const cur = conv(+s, k.cur);
      const txt = n > 1 ? roll(conv(+k.text.slice(0, n - 1), k.cur), cur, prog(t, last, .3)) : cur;
      badge = `<span class="b">${txt}</span>`;
    }
    el.innerHTML = (k.cur === "USD" ? `<span class="pre">$</span>` : "") + chars + caret + badge;
    const b = el.querySelector(".b");
    if (b) { if (n === 1) badgeIn(b, t, k.t0, 2.3); else { const q = prog(t, last, .3); tf(b, `scale(${1 + .1 * Math.sin(q * Math.PI) * (1 - q)})`, 1); } }
  }
  {
    // arrives from behind, then the camera dives into the last badge until its dark fill is the screen
    const lE = $("lE"), arr = cubicInOut(prog(t, T_E.dolly + .1, .8));
    const fy = sineInOut(prog(t, 19.6, 5));
    $("form").style.transform = `perspective(1500px) rotateY(${lerp(-16, -5, fy)}deg) rotateX(${lerp(4, 1, fy)}deg)`;
    const z = prog(t, T_E.zoom, T_E.zoomEnd - T_E.zoom);
    let css = `scale(${lerp(.62, 1, arr)})`, origin = "640px 360px";
    if (z > 0) {
      const b = $("in2").querySelector(".b");
      lE.style.transform = "none"; b.style.transform = "none";
      const [px, py] = stagePoint(b, .5, .5);
      const e = quartInOut(z), zs = Math.exp(Math.log(60) * Math.pow(z, 2.2));
      origin = `${px}px ${py}px`;
      css = `translate(${(640 - px) * e}px,${(360 - py) * e}px) scale(${zs})`;
      b.style.color = `rgba(255,255,255,${1 - clamp(z * 3.5)})`;
    }
    lE.style.transformOrigin = origin;
    tf(lE, css, t < T_E.dolly + .1 || t >= T_E.zoomEnd ? 0 : clamp(arr * 1.5));
  }

  tf($("mark"), `translateY(${(1 - expoOut(prog(t, .6, .8))) * 20}px)`, expoOut(prog(t, .6, .8)) * (1 - prog(t, T_E.zoom, .4)));

  // F · end card on the badge's dark fill
  {
    $("end").style.visibility = t >= T_E.zoomEnd - .02 ? "visible" : "hidden";
    const push = 1 + sineInOut(prog(t, T_E.zoomEnd, 4.65)) * .05;
    const lg = $("logo"), ls = spring(t - T_F.logo, 1.5, .5);
    lg.style.marginLeft = -lg.offsetWidth / 2 + "px";
    lg.style.transformOrigin = "50% 50%";
    tf(lg, `scale(${Math.max(0, ls) * push}) rotate(${(1 - ls) * -14}deg)`, clamp((t - T_F.logo) * 8));
    $("name").style.transform = $("tag").style.transform = `scale(${push})`;
    typeIn(NAME_CHARS, t, T_F.name, Infinity, { stagger: .04, dur: .8 });
    typeIn(TAG_WORDS, t, T_F.tag, Infinity, { stagger: .07, dur: .8 });
    FLOATS.forEach(([, x, y, depth], i) => {
      const t0 = T_F.tag + .1 + i * .09, s = spring(t - t0, 1.3, .6);
      const par = [.4, .8, 1.5][depth], sc = [.8, 1, 1.55][depth];
      const dx = (x - 640) * (1 - s) * -.4, dy = (y - 360) * (1 - s) * -.4;
      const drift = (t - T_E.zoomEnd) * -14 * par;
      const el = $("f" + i);
      el.style.filter = depth === 2 ? "blur(3px)" : depth === 0 ? "blur(1px)" : "none";
      tf(el, `translate(${dx + drift}px,${dy + Math.sin(t * .8 + i) * 6 * par}px) scale(${sc * Math.max(0, s)})`, clamp((t - t0) * 4) * [.45, .8, .55][depth]);
    });
  }
}

function fit() {
  const k = Math.min(innerWidth / 1280, innerHeight / 720);
  const s = $("stage"); s.style.transform = `scale(${k})`;
  s.style.left = (innerWidth - 1280 * k) / 2 + "px"; s.style.top = (innerHeight - 720 * k) / 2 + "px";
}

window.DURATION = DURATION; window.render = render;
window.ready = (async () => { fit(); await document.fonts.ready; render(0); return true; })();

// live preview when not recording
if (!location.search.includes("record")) {
  addEventListener("resize", fit);
  let start = performance.now(), paused = false, pausedAt = 0;
  const now = () => paused ? pausedAt : ((performance.now() - start) / 1000) % DURATION;
  addEventListener("keydown", e => { if (e.code === "Space") { if (paused) start = performance.now() - pausedAt * 1000; else pausedAt = now(); paused = !paused; } });
  addEventListener("click", e => { const t = e.clientX / innerWidth * DURATION; start = performance.now() - t * 1000; pausedAt = t; });
  window.ready.then(() => { const loop = () => { render(now()); requestAnimationFrame(loop); }; loop(); });
}
</script>

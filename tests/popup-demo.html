<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Popup demo</title><link rel="stylesheet" href="../extension/popup/popup.css"></head>
<body>
<!-- Renders the real popup outside Chrome with a stubbed chrome API. -->
<script>
  const store = {
    settings: { enabled: true, disabledSites: [], showAll: false, target: "DKK", disabledCurrencies: ["THB"], units: true },
    rates: { rates: { EUR: 1, DKK: 7.4748, KRW: 1499.01, USD: 1.1253 }, date: "2026-10-16", source: "ECB", fetchedAt: Date.now() },
  };
  window.chrome = {
    storage: { local: { get: (k, cb) => cb(store), set: v => Object.assign(store, v) } },
    tabs: { query: (q, cb) => cb([{ url: "https://search.naver.com/search.naver?query=x" }]) },
    runtime: { sendMessage: () => Promise.resolve({ ok: true, rates: store.rates }) },
  };
  (async () => {
    const html = await (await fetch("../extension/popup/popup.html")).text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    doc.querySelectorAll("script").forEach(s => s.remove());
    document.body.insertAdjacentHTML("afterbegin", doc.body.innerHTML);
    for (const src of ["../extension/src/parser.js", "../extension/popup/popup.js"]) {
      await new Promise(r => { const s = document.createElement("script"); s.src = src; s.onload = r; document.body.appendChild(s); });
    }
  })();
</script>
</body>
</html>

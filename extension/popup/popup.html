<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>₩ → kr.</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="badge">kr.</span>
    <div>
      <div class="rate" id="rate">Loading rate…</div>
      <div class="meta" id="meta"></div>
    </div>
    <button type="button" id="refresh" title="Refresh rate" aria-label="Refresh rate">↻</button>
  </header>

  <label class="row"><span>On</span><input type="checkbox" id="enabled"><i></i></label>
  <label class="row"><span>On <b id="site">this site</b></span><input type="checkbox" id="siteOn"><i></i></label>
  <label class="row"><span>Show all prices <small>Off: max 3 at a time</small></span><input type="checkbox" id="showAll"><i></i></label>

  <script src="popup.js"></script>
</body>
</html>
